<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Control D Guide</title>
  <desc id="desc">Soft illustration for the Control D community guide</desc>

  <!-- page-like panel matching site cream / mint -->
  <rect width="1200" height="300" rx="18" fill="#f7faf9"/>
  <rect x="24" y="24" width="1152" height="252" rx="16" fill="#ffffff" stroke="#dfe7ed" stroke-width="2"/>

  <!-- soft mint blob -->
  <circle cx="980" cy="70" r="150" fill="#dff7ef"/>
  <circle cx="1080" cy="230" r="110" fill="#e8f3ff" opacity=".9"/>

  <!-- site-style check badge -->
  <circle cx="210" cy="150" r="78" fill="#087f73"/>
  <path d="M168 152 l28 28 56-64" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- title -->
  <text x="340" y="140" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="56" font-weight="800" fill="#112033" letter-spacing="-1.5">Control D Guide</text>
  <text x="342" y="188" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="500" fill="#617084">Profiles, filters, and rules that stay maintainable</text>

  <!-- three soft chips -->
  <g font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#087f73">
    <rect x="342" y="216" width="118" height="36" rx="8" fill="#dff7ef"/>
    <text x="401" y="240" text-anchor="middle">Profiles</text>

    <rect x="476" y="216" width="102" height="36" rx="8" fill="#dff7ef"/>
    <text x="527" y="240" text-anchor="middle">Filters</text>

    <rect x="594" y="216" width="92" height="36" rx="8" fill="#dff7ef"/>
    <text x="640" y="240" text-anchor="middle">Rules</text>
  </g>
</svg>
